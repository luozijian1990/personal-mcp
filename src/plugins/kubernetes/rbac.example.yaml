apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: personal-mcp-kubernetes-reader
rules:
  - apiGroups: [""]
    resources:
      - resourcequotas
      - namespaces
      - nodes
      - persistentvolumeclaims
      - persistentvolumes
      - pods
      - services
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources:
      - pods/log
    verbs: ["get"]
  - apiGroups: ["apps"]
    resources:
      - daemonsets
      - deployments
      - replicasets
      - statefulsets
    verbs: ["get", "list"]
  - apiGroups: ["batch"]
    resources:
      - cronjobs
      - jobs
    verbs: ["get", "list"]
  - apiGroups: ["networking.k8s.io"]
    resources:
      - ingresses
      - networkpolicies
    verbs: ["get", "list"]
  - apiGroups: ["discovery.k8s.io"]
    resources:
      - endpointslices
    verbs: ["get", "list"]
  - apiGroups: ["events.k8s.io"]
    resources:
      - events
    verbs: ["get", "list"]
  - apiGroups: ["autoscaling"]
    resources:
      - horizontalpodautoscalers
    verbs: ["get", "list"]
  - apiGroups: ["policy"]
    resources:
      - poddisruptionbudgets
    verbs: ["get", "list"]
  - apiGroups: ["storage.k8s.io"]
    resources:
      - storageclasses
    verbs: ["get", "list"]
  - nonResourceURLs:
      - /version
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: personal-mcp-kubernetes-reader
subjects:
  - kind: User
    name: replace-with-kubeconfig-user
    apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: ClusterRole
  name: personal-mcp-kubernetes-reader
  apiGroup: rbac.authorization.k8s.io
